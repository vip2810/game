<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Physics Shooter</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; }
        canvas { display: block; }

        #blocker {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.85);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            z-index: 100; cursor: pointer;
        }
        #blocker h1 { font-size: 48px; color: #ff4444; margin-bottom: 16px; text-shadow: 0 0 20px #ff0000; }
        #blocker p { color: #ccc; font-size: 18px; margin: 4px 0; }
        #blocker .key { color: #ffaa00; font-weight: bold; }
        #blocker .start-hint { margin-top: 30px; color: #888; font-size: 14px; animation: pulse 2s infinite; }
        @keyframes pulse { 0%,100% { opacity: 0.5; } 50% { opacity: 1; } }

        #hud {
            position: fixed; bottom: 0; left: 0; right: 0;
            display: flex; justify-content: center; align-items: flex-end;
            padding: 20px; pointer-events: none; z-index: 10;
        }
        #hud.hidden { display: none; }

        #crosshair {
            position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none; z-index: 10;
        }
        #crosshair.hidden { display: none; }
        #crosshair .dot { width: 4px; height: 4px; background: #fff; border-radius: 50%; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); }
        #crosshair .line { position: absolute; background: rgba(255,255,255,0.7); }
        #crosshair .line.top { width: 2px; height: 12px; top: -18px; left: 50%; transform: translateX(-50%); }
        #crosshair .line.bottom { width: 2px; height: 12px; bottom: -18px; left: 50%; transform: translateX(-50%); }
        #crosshair .line.left { height: 2px; width: 12px; left: -18px; top: 50%; transform: translateY(-50%); }
        #crosshair .line.right { height: 2px; width: 12px; right: -18px; top: 50%; transform: translateY(-50%); }

        #weaponBar {
            display: flex; gap: 8px; background: rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.15); border-radius: 12px;
            padding: 8px 16px; backdrop-filter: blur(10px);
        }
        .weapon-slot {
            width: 70px; height: 70px; border: 2px solid rgba(255,255,255,0.2);
            border-radius: 8px; display: flex; flex-direction: column;
            align-items: center; justify-content: center; color: #aaa;
            font-size: 10px; text-align: center; transition: all 0.2s;
        }
        .weapon-slot.active { border-color: #ff4444; color: #fff; background: rgba(255,68,68,0.2); box-shadow: 0 0 15px rgba(255,68,68,0.3); }
        .weapon-slot .icon { font-size: 24px; margin-bottom: 2px; }
        .weapon-slot .key-hint { font-size: 9px; color: #666; margin-top: 2px; }

        #ammoDisplay {
            position: fixed; bottom: 30px; right: 30px;
            color: #fff; font-size: 36px; font-weight: bold;
            pointer-events: none; z-index: 10;
            text-shadow: 0 0 10px rgba(255,68,68,0.5);
        }
        #ammoDisplay.hidden { display: none; }
        #ammoDisplay span { font-size: 16px; color: #888; }

        #objectCount {
            position: fixed; top: 15px; left: 15px;
            color: #aaa; font-size: 13px;
            pointer-events: none; z-index: 10;
        }
        #objectCount.hidden { display: none; }

        #spawnBar {
            position: fixed; top: 15px; right: 15px;
            display: flex; gap: 6px;
            pointer-events: all; z-index: 10;
        }
        #spawnBar.hidden { display: none; }
        .spawn-btn {
            padding: 6px 14px; border: 1px solid rgba(255,255,255,0.2);
            background: rgba(0,0,0,0.5); color: #ccc; border-radius: 6px;
            cursor: pointer; font-size: 12px; transition: all 0.2s;
            backdrop-filter: blur(5px);
        }
        .spawn-btn:hover { background: rgba(255,255,255,0.15); color: #fff; }

        #hitMarker {
            position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0);
            pointer-events: none; z-index: 15;
            width: 30px; height: 30px; opacity: 0;
        }
        #hitMarker.show { animation: hitPop 0.3s ease-out; }
        @keyframes hitPop { 0% { transform: translate(-50%,-50%) scale(0.5); opacity: 1; } 100% { transform: translate(-50%,-50%) scale(1.5); opacity: 0; } }
        #hitMarker .hm { position: absolute; background: #fff; }
        #hitMarker .hm.tl { width: 8px; height: 2px; top: 4px; left: 0; transform: rotate(-45deg); }
        #hitMarker .hm.tr { width: 8px; height: 2px; top: 4px; right: 0; transform: rotate(45deg); }
        #hitMarker .hm.bl { width: 8px; height: 2px; bottom: 4px; left: 0; transform: rotate(45deg); }
        #hitMarker .hm.br { width: 8px; height: 2px; bottom: 4px; right: 0; transform: rotate(-45deg); }

        #muzzleFlash {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at 50% 80%, rgba(255,200,50,0.15), transparent 40%);
            pointer-events: none; z-index: 5; opacity: 0;
        }
        #muzzleFlash.flash { animation: mflash 0.08s ease-out; }
        @keyframes mflash { 0% { opacity: 1; } 100% { opacity: 0; } }
    </style>
</head>
<body>

<div id="blocker">
    <h1>3D PHYSICS SHOOTER</h1>
    <p><span class="key">WASD</span> - Move</p>
    <p><span class="key">Mouse</span> - Look around</p>
    <p><span class="key">Left Click</span> - Shoot</p>
    <p><span class="key">1-4</span> - Switch weapons</p>
    <p><span class="key">R</span> - Reset scene</p>
    <p class="start-hint">Click anywhere to start</p>
</div>

<div id="crosshair" class="hidden">
    <div class="dot"></div>
    <div class="line top"></div>
    <div class="line bottom"></div>
    <div class="line left"></div>
    <div class="line right"></div>
</div>

<div id="hitMarker">
    <div class="hm tl"></div>
    <div class="hm tr"></div>
    <div class="hm bl"></div>
    <div class="hm br"></div>
</div>

<div id="muzzleFlash"></div>

<div id="hud" class="hidden">
    <div id="weaponBar">
        <div class="weapon-slot active" data-weapon="0">
            <div class="icon">&#9679;</div>
            <div>Cannon</div>
            <div class="key-hint">1</div>
        </div>
        <div class="weapon-slot" data-weapon="1">
            <div class="icon">&#9632;</div>
            <div>Shotgun</div>
            <div class="key-hint">2</div>
        </div>
        <div class="weapon-slot" data-weapon="2">
            <div class="icon">&#10038;</div>
            <div>Explosive</div>
            <div class="key-hint">3</div>
        </div>
        <div class="weapon-slot" data-weapon="3">
            <div class="icon">&#9650;</div>
            <div>Sniper</div>
            <div class="key-hint">4</div>
        </div>
    </div>
</div>

<div id="ammoDisplay" class="hidden"><span>AMMO</span><br>&#8734;</div>

<div id="objectCount" class="hidden">Objects: 0</div>

<div id="spawnBar" class="hidden">
    <button class="spawn-btn" onclick="spawnTower()">Tower</button>
    <button class="spawn-btn" onclick="spawnWall()">Wall</button>
    <button class="spawn-btn" onclick="spawnPyramid()">Pyramid</button>
    <button class="spawn-btn" onclick="spawnStack()">Stack</button>
    <button class="spawn-btn" onclick="clearDynamic()">Clear</button>
</div>

<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.171.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.171.0/examples/jsm/",
        "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"
    }
}
</script>

<script type="module">
import * as THREE from 'three';
import * as CANNON from 'cannon-es';

// --- Scene setup ---
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a2e);
scene.fog = new THREE.FogExp2(0x1a1a2e, 0.008);

const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 5, 25);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
document.body.appendChild(renderer.domElement);

// --- Physics world ---
const world = new CANNON.World({ gravity: new CANNON.Vec3(0, -20, 0) });
world.broadphase = new CANNON.SAPBroadphase(world);
world.allowSleep = true;
world.solver.iterations = 10;

const defaultMaterial = new CANNON.Material('default');
world.defaultContactMaterial = new CANNON.ContactMaterial(defaultMaterial, defaultMaterial, {
    friction: 0.4,
    restitution: 0.3
});

// --- Lighting ---
const ambientLight = new THREE.AmbientLight(0x404060, 0.6);
scene.add(ambientLight);

const dirLight = new THREE.DirectionalLight(0xffeedd, 1.5);
dirLight.position.set(30, 50, 20);
dirLight.castShadow = true;
dirLight.shadow.mapSize.set(2048, 2048);
dirLight.shadow.camera.left = -60;
dirLight.shadow.camera.right = 60;
dirLight.shadow.camera.top = 60;
dirLight.shadow.camera.bottom = -60;
dirLight.shadow.camera.near = 0.5;
dirLight.shadow.camera.far = 150;
scene.add(dirLight);

const fillLight = new THREE.DirectionalLight(0x4466aa, 0.4);
fillLight.position.set(-20, 20, -10);
scene.add(fillLight);

const pointLight = new THREE.PointLight(0xff4400, 0.5, 50);
pointLight.position.set(0, 10, 0);
scene.add(pointLight);

// --- Ground ---
const groundGeo = new THREE.PlaneGeometry(200, 200);
const groundMat = new THREE.MeshStandardMaterial({
    color: 0x2a2a3e,
    roughness: 0.8,
    metalness: 0.2,
});
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const gridHelper = new THREE.GridHelper(200, 50, 0x3a3a5a, 0x2a2a4a);
gridHelper.position.y = 0.01;
scene.add(gridHelper);

const groundBody = new CANNON.Body({
    type: CANNON.Body.STATIC,
    shape: new CANNON.Plane(),
    material: defaultMaterial
});
groundBody.quaternion.setFromEuler(-Math.PI / 2, 0, 0);
world.addBody(groundBody);

// invisible walls
for (const [px, pz, rx, rz] of [[0, -100, 0, 0], [0, 100, 0, Math.PI], [-100, 0, 0, Math.PI/2], [100, 0, 0, -Math.PI/2]]) {
    const wall = new CANNON.Body({ type: CANNON.Body.STATIC, shape: new CANNON.Plane(), material: defaultMaterial });
    wall.position.set(px, 0, pz);
    wall.quaternion.setFromEuler(0, rz, rx);
    world.addBody(wall);
}

// --- Tracked objects ---
const physicsObjects = [];

const boxColors = [0xff6b6b, 0xffd93d, 0x6bcb77, 0x4d96ff, 0xff8cc8, 0xa66cff, 0xff922b, 0x20c997, 0x748ffc, 0xe599f7];

function createBox(x, y, z, w, h, d, color, mass = 1) {
    const geo = new THREE.BoxGeometry(w, h, d);
    const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.5, metalness: 0.3 });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    scene.add(mesh);

    const body = new CANNON.Body({
        mass,
        shape: new CANNON.Box(new CANNON.Vec3(w/2, h/2, d/2)),
        position: new CANNON.Vec3(x, y, z),
        material: defaultMaterial
    });
    body.linearDamping = 0.1;
    body.angularDamping = 0.3;
    world.addBody(body);

    physicsObjects.push({ mesh, body, type: 'dynamic' });
    return { mesh, body };
}

function createSphere(x, y, z, r, color, mass = 2) {
    const geo = new THREE.SphereGeometry(r, 16, 16);
    const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.3, metalness: 0.5 });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.castShadow = true;
    scene.add(mesh);

    const body = new CANNON.Body({
        mass,
        shape: new CANNON.Sphere(r),
        position: new CANNON.Vec3(x, y, z),
        material: defaultMaterial
    });
    body.linearDamping = 0.1;
    body.angularDamping = 0.3;
    world.addBody(body);

    physicsObjects.push({ mesh, body, type: 'dynamic' });
    return { mesh, body };
}

// --- Scene builders ---
function clearDynamic() {
    for (let i = physicsObjects.length - 1; i >= 0; i--) {
        const obj = physicsObjects[i];
        if (obj.type === 'dynamic') {
            scene.remove(obj.mesh);
            world.removeBody(obj.body);
            obj.mesh.geometry.dispose();
            obj.mesh.material.dispose();
            physicsObjects.splice(i, 1);
        }
    }
}
window.clearDynamic = clearDynamic;

function spawnTower() {
    const bx = (Math.random() - 0.5) * 20;
    const bz = (Math.random() - 0.5) * 20 - 10;
    for (let row = 0; row < 8; row++) {
        const c = boxColors[row % boxColors.length];
        if (row % 2 === 0) {
            createBox(bx - 0.6, row * 1.05 + 0.525, bz, 1, 1, 2.5, c);
            createBox(bx + 0.6, row * 1.05 + 0.525, bz, 1, 1, 2.5, c);
        } else {
            createBox(bx, row * 1.05 + 0.525, bz - 0.6, 2.5, 1, 1, c);
            createBox(bx, row * 1.05 + 0.525, bz + 0.6, 2.5, 1, 1, c);
        }
    }
}
window.spawnTower = spawnTower;

function spawnWall() {
    const bx = (Math.random() - 0.5) * 20;
    const bz = (Math.random() - 0.5) * 10 - 15;
    const cols = 8, rows = 6;
    for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
            const offset = (r % 2) * 0.6;
            const color = boxColors[(r + c) % boxColors.length];
            createBox(bx + (c - cols/2) * 1.2 + offset, r * 1.05 + 0.525, bz, 1.1, 1, 1.1, color);
        }
    }
}
window.spawnWall = spawnWall;

function spawnPyramid() {
    const bx = (Math.random() - 0.5) * 20;
    const bz = (Math.random() - 0.5) * 10 - 10;
    const base = 6;
    for (let row = 0; row < base; row++) {
        const count = base - row;
        for (let i = 0; i < count; i++) {
            const color = boxColors[(row + i) % boxColors.length];
            createBox(
                bx + (i - (count - 1) / 2) * 1.15,
                row * 1.05 + 0.525,
                bz,
                1.1, 1, 1.1, color
            );
        }
    }
}
window.spawnPyramid = spawnPyramid;

function spawnStack() {
    const bx = (Math.random() - 0.5) * 20;
    const bz = (Math.random() - 0.5) * 10 - 10;
    for (let i = 0; i < 10; i++) {
        const color = boxColors[i % boxColors.length];
        createSphere(bx + (Math.random()-0.5)*0.3, i * 1.2 + 0.6, bz + (Math.random()-0.5)*0.3, 0.5, color);
    }
}
window.spawnStack = spawnStack;

function buildInitialScene() {
    spawnTower();
    spawnWall();
    spawnPyramid();
}

buildInitialScene();

// --- FPS Controls ---
let locked = false;
const velocity = new THREE.Vector3();
const euler = new THREE.Euler(0, 0, 0, 'YXZ');
const keys = {};
let pitch = 0, yaw = 0;

document.getElementById('blocker').addEventListener('click', () => {
    renderer.domElement.requestPointerLock();
});

document.addEventListener('pointerlockchange', () => {
    locked = !!document.pointerLockElement;
    document.getElementById('blocker').style.display = locked ? 'none' : 'flex';
    document.getElementById('hud').classList.toggle('hidden', !locked);
    document.getElementById('crosshair').classList.toggle('hidden', !locked);
    document.getElementById('ammoDisplay').classList.toggle('hidden', !locked);
    document.getElementById('objectCount').classList.toggle('hidden', !locked);
    document.getElementById('spawnBar').classList.toggle('hidden', !locked);
});

document.addEventListener('mousemove', (e) => {
    if (!locked) return;
    yaw -= e.movementX * 0.002;
    pitch -= e.movementY * 0.002;
    pitch = Math.max(-Math.PI / 2 + 0.1, Math.min(Math.PI / 2 - 0.1, pitch));
    euler.set(pitch, yaw, 0);
    camera.quaternion.setFromEuler(euler);
});

document.addEventListener('keydown', (e) => { keys[e.code] = true; });
document.addEventListener('keyup', (e) => { keys[e.code] = false; });

document.addEventListener('keydown', (e) => {
    if (e.code === 'Digit1') selectWeapon(0);
    if (e.code === 'Digit2') selectWeapon(1);
    if (e.code === 'Digit3') selectWeapon(2);
    if (e.code === 'Digit4') selectWeapon(3);
    if (e.code === 'KeyR') {
        clearDynamic();
        buildInitialScene();
    }
});

function updateMovement(dt) {
    if (!locked) return;
    const speed = 30;
    const dir = new THREE.Vector3();
    camera.getWorldDirection(dir);
    dir.y = 0;
    dir.normalize();
    const right = new THREE.Vector3().crossVectors(dir, new THREE.Vector3(0, 1, 0)).normalize();

    velocity.set(0, 0, 0);
    if (keys['KeyW']) velocity.add(dir);
    if (keys['KeyS']) velocity.sub(dir);
    if (keys['KeyD']) velocity.add(right);
    if (keys['KeyA']) velocity.sub(right);

    if (velocity.length() > 0) {
        velocity.normalize().multiplyScalar(speed * dt);
        camera.position.add(velocity);
    }
    camera.position.y = 5;
}

// --- Weapons ---
const weapons = [
    { name: 'Cannon', speed: 80, size: 0.5, mass: 8, color: 0xff4444, count: 1, spread: 0, explosive: false, cooldown: 0.3 },
    { name: 'Shotgun', speed: 60, size: 0.2, mass: 1, color: 0xffaa00, count: 8, spread: 0.08, explosive: false, cooldown: 0.6 },
    { name: 'Explosive', speed: 50, size: 0.4, mass: 5, color: 0xff2200, count: 1, spread: 0, explosive: true, cooldown: 0.8 },
    { name: 'Sniper', speed: 200, size: 0.15, mass: 15, color: 0x44aaff, count: 1, spread: 0, explosive: false, cooldown: 0.2 },
];

let currentWeapon = 0;
let lastShotTime = 0;

function selectWeapon(idx) {
    currentWeapon = idx;
    document.querySelectorAll('.weapon-slot').forEach((el, i) => {
        el.classList.toggle('active', i === idx);
    });
}

// --- Shooting ---
const projectiles = [];
const explosionParticles = [];

function shoot() {
    const now = performance.now() / 1000;
    const wp = weapons[currentWeapon];
    if (now - lastShotTime < wp.cooldown) return;
    lastShotTime = now;

    const dir = new THREE.Vector3();
    camera.getWorldDirection(dir);

    for (let i = 0; i < wp.count; i++) {
        const d = dir.clone();
        if (wp.spread > 0) {
            d.x += (Math.random() - 0.5) * wp.spread;
            d.y += (Math.random() - 0.5) * wp.spread;
            d.z += (Math.random() - 0.5) * wp.spread;
            d.normalize();
        }

        const startPos = camera.position.clone().add(d.clone().multiplyScalar(1.5));
        const obj = createSphere(startPos.x, startPos.y, startPos.z, wp.size, wp.color, wp.mass);

        obj.body.velocity.set(d.x * wp.speed, d.y * wp.speed, d.z * wp.speed);
        obj.body.collisionResponse = true;

        if (wp.explosive) {
            obj.body.addEventListener('collide', (e) => {
                explode(obj.body.position, 12, 60);
                setTimeout(() => {
                    const idx = physicsObjects.indexOf(obj);
                    if (idx !== -1) {
                        scene.remove(obj.mesh);
                        world.removeBody(obj.body);
                        obj.mesh.geometry.dispose();
                        obj.mesh.material.dispose();
                        physicsObjects.splice(idx, 1);
                    }
                }, 0);
            });
        }

        obj.body.addEventListener('collide', () => showHitMarker());

        projectiles.push({ obj, time: now });
    }

    // muzzle flash
    const mf = document.getElementById('muzzleFlash');
    mf.classList.remove('flash');
    void mf.offsetWidth;
    mf.classList.add('flash');
}

function showHitMarker() {
    const hm = document.getElementById('hitMarker');
    hm.classList.remove('show');
    void hm.offsetWidth;
    hm.classList.add('show');
}

function explode(position, radius, force) {
    for (const obj of physicsObjects) {
        if (obj.body.type === CANNON.Body.STATIC) continue;
        const dx = obj.body.position.x - position.x;
        const dy = obj.body.position.y - position.y;
        const dz = obj.body.position.z - position.z;
        const dist = Math.sqrt(dx * dx + dy * dy + dz * dz);
        if (dist < radius && dist > 0.01) {
            const strength = force * (1 - dist / radius);
            const impulse = new CANNON.Vec3(
                (dx / dist) * strength,
                (dy / dist) * strength + strength * 0.5,
                (dz / dist) * strength
            );
            obj.body.applyImpulse(impulse);
            obj.body.wakeUp();
        }
    }

    // visual explosion
    for (let i = 0; i < 30; i++) {
        const geo = new THREE.SphereGeometry(0.1 + Math.random() * 0.2, 6, 6);
        const mat = new THREE.MeshBasicMaterial({
            color: new THREE.Color().setHSL(0.05 + Math.random() * 0.08, 1, 0.5 + Math.random() * 0.3)
        });
        const particle = new THREE.Mesh(geo, mat);
        particle.position.set(position.x, position.y, position.z);
        scene.add(particle);

        explosionParticles.push({
            mesh: particle,
            velocity: new THREE.Vector3(
                (Math.random() - 0.5) * 20,
                Math.random() * 15,
                (Math.random() - 0.5) * 20
            ),
            life: 1.0
        });
    }

    // explosion light flash
    const light = new THREE.PointLight(0xff4400, 5, 20);
    light.position.set(position.x, position.y, position.z);
    scene.add(light);
    setTimeout(() => scene.remove(light), 200);
}

document.addEventListener('mousedown', (e) => {
    if (!locked || e.button !== 0) return;
    shoot();
});

// --- Cleanup old projectiles ---
function cleanupProjectiles(now) {
    for (let i = projectiles.length - 1; i >= 0; i--) {
        if (now - projectiles[i].time > 8) {
            const obj = projectiles[i].obj;
            const idx = physicsObjects.indexOf(obj);
            if (idx !== -1) {
                scene.remove(obj.mesh);
                world.removeBody(obj.body);
                obj.mesh.geometry.dispose();
                obj.mesh.material.dispose();
                physicsObjects.splice(idx, 1);
            }
            projectiles.splice(i, 1);
        }
    }
}

// --- Update explosion particles ---
function updateParticles(dt) {
    for (let i = explosionParticles.length - 1; i >= 0; i--) {
        const p = explosionParticles[i];
        p.velocity.y -= 15 * dt;
        p.mesh.position.add(p.velocity.clone().multiplyScalar(dt));
        p.life -= dt * 2;
        p.mesh.material.opacity = Math.max(0, p.life);
        p.mesh.material.transparent = true;
        p.mesh.scale.setScalar(p.life);

        if (p.life <= 0) {
            scene.remove(p.mesh);
            p.mesh.geometry.dispose();
            p.mesh.material.dispose();
            explosionParticles.splice(i, 1);
        }
    }
}

// --- Skybox via hemisphere ---
const skyGeo = new THREE.SphereGeometry(400, 32, 32);
const skyMat = new THREE.ShaderMaterial({
    side: THREE.BackSide,
    uniforms: {
        topColor: { value: new THREE.Color(0x0a0a2e) },
        bottomColor: { value: new THREE.Color(0x1a1a3e) },
        offset: { value: 20 },
        exponent: { value: 0.4 }
    },
    vertexShader: `
        varying vec3 vWorldPosition;
        void main() {
            vec4 worldPosition = modelMatrix * vec4(position, 1.0);
            vWorldPosition = worldPosition.xyz;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
    `,
    fragmentShader: `
        uniform vec3 topColor;
        uniform vec3 bottomColor;
        uniform float offset;
        uniform float exponent;
        varying vec3 vWorldPosition;
        void main() {
            float h = normalize(vWorldPosition + offset).y;
            gl_FragColor = vec4(mix(bottomColor, topColor, max(pow(max(h, 0.0), exponent), 0.0)), 1.0);
        }
    `
});
scene.add(new THREE.Mesh(skyGeo, skyMat));

// --- Game loop ---
const clock = new THREE.Clock();
let frameCount = 0;

function animate() {
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.05);
    const now = performance.now() / 1000;

    updateMovement(dt);
    world.step(1/60, dt, 3);

    for (const obj of physicsObjects) {
        obj.mesh.position.copy(obj.body.position);
        obj.mesh.quaternion.copy(obj.body.quaternion);
    }

    cleanupProjectiles(now);
    updateParticles(dt);

    frameCount++;
    if (frameCount % 10 === 0) {
        const dynCount = physicsObjects.filter(o => o.type === 'dynamic').length;
        document.getElementById('objectCount').textContent = `Objects: ${dynCount}`;
    }

    renderer.render(scene, camera);
}

animate();

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
